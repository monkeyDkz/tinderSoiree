name: TinderSoiree
options:
  bundleIdPrefix: com.tindersoiree
  deploymentTarget:
    iOS: "17.0"

targets:
  TinderSoiree:
    type: application
    platform: iOS
    sources:
      - TinderSoiree
    settings:
      base:
        INFOPLIST_FILE: TinderSoiree/Info.plist
        CODE_SIGN_ENTITLEMENTS: TinderSoiree/TinderSoiree.entitlements
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.tindersoiree.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
